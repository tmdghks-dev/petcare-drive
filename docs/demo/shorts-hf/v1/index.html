<!doctype html>
<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "SDGothic"; src: local("Apple SD Gothic Neo"), local("AppleSDGothicNeo-Regular"); font-weight: 400; }
      @font-face { font-family: "SDGothic"; src: local("AppleSDGothicNeo-Medium"); font-weight: 500; }
      @font-face { font-family: "SDGothic"; src: local("AppleSDGothicNeo-Bold"); font-weight: 700; }
      @font-face { font-family: "SDGothic"; src: local("AppleSDGothicNeo-Heavy"); font-weight: 900; }
      :root { --ground: #f1f4f6; --ink: #202833; --accent: #087db5; --font-display: "SDGothic"; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      #ground { position: absolute; inset: 0; background: var(--ground); }
      #timer { position: absolute; left: 0; right: 0; top: 196px; display: flex; justify-content: center; z-index: 20; }
      #timer-pill { display: flex; align-items: center; gap: 18px; padding: 16px 34px; border-radius: 999px; background: #fff;
        box-shadow: 0 12px 30px rgba(16, 24, 40, 0.1); font-family: var(--font-display); }
      #timer-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); }
      #timer-label { font-size: 36px; font-weight: 500; color: #5b6673; }
      #timer-time { font-size: 40px; font-weight: 900; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="35" data-width="1080" data-height="1920">
      <div id="ground"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="guard" data-composition-id="guard" data-composition-src="compositions/guard.html" data-start="3.6" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="bark" data-composition-id="bark" data-composition-src="compositions/bark.html" data-start="8.6" data-duration="6.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="push" data-composition-id="push" data-composition-src="compositions/push.html" data-start="15" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="temp" data-composition-id="temp" data-composition-src="compositions/temp.html" data-start="18" data-duration="4.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="danger" data-composition-id="danger" data-composition-src="compositions/danger.html" data-start="22.6" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="calm" data-composition-id="calm" data-composition-src="compositions/calm.html" data-start="26.6" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="29.8" data-duration="5.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- 혼자 남은 시간: 3분에서 시작해 진정 장면에서 15분으로 뛴다 -->
      <div id="timer" class="clip" data-start="0" data-duration="29.8" data-track-index="2">
        <div id="timer-pill"><span id="timer-dot"></span><span id="timer-label">달이 혼자 남은 지</span><span id="timer-time">03:00</span></div>
      </div>

      <audio id="vo-hook" class="clip" src="assets/vo/hook.wav" data-start="0.15" data-duration="3.1" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-guard" class="clip" src="assets/vo/guard.wav" data-start="3.75" data-duration="4.6" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-bark" class="clip" src="assets/vo/bark.wav" data-start="9.9" data-duration="4.2" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-push" class="clip" src="assets/vo/push.wav" data-start="15.2" data-duration="2.3" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-temp" class="clip" src="assets/vo/temp.wav" data-start="18.2" data-duration="3.5" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-danger" class="clip" src="assets/vo/danger.wav" data-start="22.8" data-duration="3.4" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-calm" class="clip" src="assets/vo/calm.wav" data-start="26.9" data-duration="2.6" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-end" class="clip" src="assets/vo/end.wav" data-start="30.4" data-duration="4.3" data-track-index="5" data-volume="1"></audio>
      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-duration="35" data-track-index="6" data-volume="0.14" data-fade-out="2.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const clock = { s: 180 };
      const show = () => {
        const s = Math.floor(clock.s);
        document.querySelector("#timer-time").textContent =
          String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      };
      tl.fromTo("#timer-pill", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.2);
      tl.fromTo(clock, { s: 180 }, { s: 410, duration: 26.4, ease: "none", onUpdate: show }, 0.2);
      tl.to(clock, { s: 900, duration: 0.7, ease: "power3.out", onUpdate: show }, 26.6);
      tl.to("#timer-dot", { backgroundColor: "#d93636", duration: 0.2 }, 22.6);
      tl.to("#timer-dot", { backgroundColor: "#087db5", duration: 0.2 }, 26.6);
      tl.fromTo("#timer-time", { color: "#202833" }, { color: "#087db5", duration: 0.3 }, 26.6);
      tl.to("#timer-pill", { opacity: 0, duration: 0.3, ease: "power3.in" }, 29.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
