    <script>
      const tl = gsap.timeline({ paused: true });
      const clock = { s: 180 };
      const show = () => {
        const s = Math.floor(clock.s);
        document.querySelector("#timer-time").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      };
      tl.fromTo("#timer-pill", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 29.7);
      tl.fromTo(clock, { s: 180 }, { s: 470, duration: 24.1, ease: "none", onUpdate: show }, 29.7);
      tl.to(clock, { s: 900, duration: 0.7, ease: "power3.out", onUpdate: show }, 53.8);
      tl.fromTo("#timer-time", { color: "#202833" }, { color: "#087db5", duration: 0.3 }, 53.8);
      tl.to("#timer-dot", { backgroundColor: "#d93636", duration: 0.2 }, 63.1);
      tl.to("#timer-pill", { opacity: 0, duration: 0.3, ease: "power3.in" }, 68.05);
      window.__timelines["main"] = tl;
