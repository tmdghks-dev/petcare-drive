  <script>
    const tl = gsap.timeline({ paused: true });
    const FPS = 30;

    // 숫자 세기: 프레임마다 글자를 정해 두어 어느 시점으로 이동해도 같은 숫자가 나온다.
    // GSAP 은 "23.0" 같은 순수 숫자 문자열을 숫자로 바꿔 ".0"을 버리므로, 소수는 단위를 붙여 문자열로 넘긴다.
    function count(el, from, to, start, dur, ease, fmt) {
      const n = Math.max(1, Math.round(dur * FPS));
      const e = gsap.parseEase(ease);
      tl.set(el, { textContent: fmt(from) }, 0);
      for (let i = 1; i <= n; i++) {
        tl.set(el, { textContent: fmt(from + (to - from) * e(i / n)) }, start + (dur * i) / n);
      }
    }
    const int = (v) => String(Math.round(v));
    function blurIn(sel, at, dur = 0.2) {
      tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: dur, ease: "power4.out" }, at);
    }

    // 1. 차가 오른쪽에서 들어와 멈춘다
    tl.fromTo("#car", { x: 260, opacity: 0, filter: "blur(6px)" }, { x: 0, duration: 1.1, ease: "expo.out" }, 0.15);
    tl.to("#car", { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.15);
    tl.to("#car", { filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 0.15);
