plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.petcare.drive.car'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.petcare.drive.car'
        minSdk 28 // Pleos 요구사항: API 28 이상
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'ai.pleos.playground:Vehicle:2.3.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.mediapipe:tasks-audio:1.0.0'
    implementation 'com.google.zxing:core:3.5.3' // ⑤ 연결 QR 만들기

    // Firebase (선환 firebase 브랜치). google-services.json을 app/에 넣고 plugins에 google-services를 켜면 연결된다
    implementation platform('com.google.firebase:firebase-bom:33.9.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-auth'
}
