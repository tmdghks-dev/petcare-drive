plugins {
    id 'com.android.application'
}
// Firebase 설정 파일이 있을 때만 연결한다. 없으면 오프라인으로 빌드·동작 (google-services.json은 git에 올리지 않음)
if (file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'

android {
    namespace 'ai.petcare.drive.car'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.petcare.drive.car'
        minSdk 28 // Pleos 요구사항: API 28 이상
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'ai.pleos.playground:Vehicle:2.3.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.mediapipe:tasks-audio:1.0.0'
    implementation 'com.google.zxing:core:3.5.3' // ⑤ 연결 QR 만들기

    // Firebase. google-services.json을 app/에 넣으면 자동으로 연결된다 (위 apply plugin 참고)
    implementation platform('com.google.firebase:firebase-bom:33.9.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-auth'
}
